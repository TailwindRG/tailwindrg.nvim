name: Theme smoke tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Neovim
        run: sudo apt-get update && sudo apt-get install --yes neovim
      - name: Test theme and help
        run: nvim --headless -u NONE -l tests/smoke.lua
